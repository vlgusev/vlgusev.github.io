<header>
  <nav id="navbar" aria-label="Main navigation" class="navbar navbar-light navbar-expand {% if site.navbar_fixed %}fixed-top{% else %}sticky-top{% endif %}">
    <div class="container">
      <ul class="navbar-nav ml-auto flex-nowrap align-items-center">
        <li class="nav-item {% if page.permalink == '/' %}active{% endif %}">
          <a class="nav-link" href="{{ '/' | relative_url }}" {% if page.permalink == '/' %}aria-current="page"{% endif %}>About</a>
        </li>
        {% assign navigation_pages = site.pages | sort: 'nav_order' %}
        {% for nav_page in navigation_pages %}
          {% if nav_page.nav %}
          <li class="nav-item {% if page.url == nav_page.url %}active{% endif %}">
            <a class="nav-link" href="{{ nav_page.url | relative_url }}" {% if page.url == nav_page.url %}aria-current="page"{% endif %}>{{ nav_page.title }}</a>
          </li>
          {% endif %}
        {% endfor %}
        {% if site.enable_darkmode %}
        <li class="toggle-container">
                <button id="light-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
                  <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1 9 9 0 1 0 20.9 13.1Z" /></svg>
                  <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
                </button>
        </li>
        {% endif %}
      </ul>
    </div>
  </nav>
</header>
